<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s in My Fridge? Recipe Finder</title>
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#2b2622;--mute:#7a7068;--line:#e6dccd;--acc:#d9531e;--acc2:#fbe6db;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#27221f;--ink:#f3ece4;--mute:#a69b91;--line:#3b342f;--acc:#f07a4a;--acc2:#3a2a22;--on:#1c1917;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#27221f;--ink:#f3ece4;--mute:#a69b91;--line:#3b342f;--acc:#f07a4a;--acc2:#3a2a22;--on:#1c1917;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:32px 18px 60px}
h1{font-size:2rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px;font-family:system-ui,sans-serif}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;font-family:system-ui,sans-serif}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{width:110px;flex:none;color:var(--mute);font-size:.9rem}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:10px;margin:4px 0 6px;font-size:.95rem}
.chk input{width:18px;height:18px}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.add{background:none;border:1px dashed var(--acc);color:var(--acc);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;margin:4px 0 18px}
.go{width:100%;background:var(--acc);color:var(--on);border:0;padding:14px;border-radius:12px;font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer;margin-top:14px}
.go:disabled{opacity:.5;cursor:wait}
.cl{margin-top:6px}
#out{margin-top:26px}
.msg{color:var(--mute);font-family:system-ui,sans-serif;text-align:center;padding:20px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.rc h2{margin:0 0 4px;font-size:1.25rem}
.meta{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mute);margin-bottom:10px}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);padding:2px 9px;border-radius:99px;margin-right:6px;font-size:.78rem}
.rc h3{font-family:system-ui,sans-serif;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:12px 0 4px}
.rc ul,.rc ol{margin:0;padding-left:20px}
.need{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>🍳 What’s in my fridge?</h1>
<p class="sub">Type what you have lying around and get recipe ideas.</p>
<div class="panel">
  <div id="ings"></div>
  <button class="add" id="add" type="button">+ Add more ingredients</button>
  <div class="row cl"><label for="cuisine">Cuisine (optional)</label>
    <select id="cuisine"><option value="">Any cuisine</option><option>Italian</option><option>Chinese</option><option>Indian</option><option>Thai</option><option>Mexican</option><option>Japanese</option><option>Mediterranean</option><option>French</option><option>Korean</option><option>Middle Eastern</option><option>American</option><option>Greek</option><option>Spanish</option><option>Vietnamese</option></select></div>
  <div class="row"><label for="diet">Diet (optional)</label>
    <select id="diet"><option value="">No restriction</option><option>Vegetarian</option><option>Vegan</option><option>Gluten-free</option><option>Dairy-free</option><option>Pescatarian</option><option>Ketogenic</option></select></div>
  <div class="row"><label for="serv">Servings</label><input id="serv" type="number" min="1" max="20" value="2"></div>
  <label class="chk"><input type="checkbox" id="only"> Use only these ingredients (plus basic staples)</label>
  <button class="go" id="go" type="button">Find recipes</button>
</div>
<div id="out"></div>
<p class="sub" style="margin-top:24px;font-size:.8rem">Recipe data from <a href="https://spoonacular.com/food-api" target="_blank" rel="noopener">spoonacular</a>.</p>
</main>
<script>
const ings=document.getElementById('ings'),out=document.getElementById('out'),go=document.getElementById('go');
const ph=['chicken','beef','celery','rice','onion','tomato','eggs'];
function addRow(){
  const n=ings.children.length+1,r=document.createElement('div');r.className='row';
  const l=document.createElement('label');l.textContent='Ingredient '+n+':';l.htmlFor='i'+n;
  const i=document.createElement('input');i.id='i'+n;i.type='text';i.placeholder='e.g. '+(ph[(n-1)%ph.length]);i.autocomplete='off';
  i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go.click()}});
  r.append(l,i);ings.append(r);return i;
}
for(let k=0;k<5;k++)addRow();
document.getElementById('add').onclick=()=>addRow().focus();
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function render(list){
  if(!Array.isArray(list)||!list.length){out.innerHTML='<div class="msg">No recipes came back. Try different ingredients.</div>';return}
  out.innerHTML=list.map(r=>`<div class="rc"><h2>${esc(r.name)}</h2>
  <div class="meta"><span class="tag">${esc(r.cuisine)}</span>⏱ ${esc(r.time)}</div>
  <div>${esc(r.description)}</div>
  ${r.link?`<div class="meta"><a href="${esc(r.link)}" target="_blank" rel="noopener">View original recipe ↗</a></div>`:''}
  <h3>Ingredients</h3><ul>${(r.ingredients||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  ${(r.also_needed&&r.also_needed.length)?`<h3>Extra pantry items</h3><div class="need">${r.also_needed.map(esc).join(', ')}</div>`:''}
  <h3>Steps</h3><ol>${(r.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`).join('');
}
go.onclick=async()=>{
  const have=[...ings.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);
  if(!have.length){out.innerHTML='<div class="msg">Add at least one ingredient first.</div>';return}
  const cu=document.getElementById('cuisine').value;
  const diet=document.getElementById('diet').value;
  const serv=Math.min(20,Math.max(1,parseInt(document.getElementById('serv').value)||2));
  const only=document.getElementById('only').checked;
  go.disabled=true;go.textContent='Cooking up ideas…';out.innerHTML='<div class="msg">Finding recipes…</div>';
  try{
    const r=await fetch('/api/recipes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ingredients:have,cuisine:cu,diet,servings:serv,only})});
    if(r.status===429)throw {code:'rate_limited'};
    if(!r.ok)throw new Error('server');
    const res=(await r.json()).recipes;
    render(res);
  }catch(e){
    out.innerHTML='<div class="msg">Something went wrong'+(e&&e.code==='rate_limited'?' (too many requests or daily limit reached, try later)':'')+'. Please try again.</div>';
  }finally{go.disabled=false;go.textContent='Find recipes'}
};
</script>
</body>
</html>
